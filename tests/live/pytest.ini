[pytest]
# Read-only checks against the DEPLOYED application (Render). Independent of tests/ui: no database access,
# no test data, no E2E mode. Needs only: LIVE_BASE_URL, LIVE_API_URL (and optionally a smoke account).
addopts =
    --strict-markers
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --output=test-results-live
markers =
    live: read-only checks against the deployed application
