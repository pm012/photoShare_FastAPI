[pytest]
# This file makes tests/ui an independent pytest "project":
#  * rootdir = tests/ui, so the unit-test conftest (tests/conftest.py, which imports the
#    FastAPI app and SQLite) is NOT loaded, and pyproject's --cov options do not apply;
#  * pythonpath = ../..  puts the repo root on sys.path (replaces `PYTHONPATH=.`), so both
#    `tests.ui...` and `src...` imports work.
pythonpath = ../..
testpaths = .
asyncio_mode = strict
addopts =
    --import-mode=importlib
    --strict-markers
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --output=test-results
    --dist=worksteal
    --maxprocesses=4
markers =
    smoke: fast checks that the stack is up and the app renders
    framework: self-checks of the test framework itself (no browser needed)
    auth: login, signup, password reset, logout, session expiry
    feed: photo feed, search, filters, upload dialog
    photo: single photo page (rating, comments, edit, delete)
    profile: own and public profiles, avatar
    admin: user management panel
    moderation: image moderation panel
    session: expired/invalid sessions, inactivity
    rbac: role-based visibility and permissions
