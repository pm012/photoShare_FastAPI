name: CI Pipeline

# Unit tests only. This is the job to mark as "required" in branch protection.
# Browser (UI) tests run in a separate workflow (e2e.yml, added in step 5).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: '2.4.2'
        virtualenvs-create: true
        virtualenvs-in-project: true

    # No "poetry lock" here: the committed poetry.lock must be the source of truth.
    # If this step fails with "pyproject.toml changed significantly", run `poetry lock`
    # locally and commit poetry.lock.
    - name: Install dependencies (unit-test group only, no Playwright)
      run: poetry install --with dev --no-interaction

    - name: Run Pytest
      env:
        PYTHONPATH: .
        DATABASE_URL: "sqlite:///:memory:"
        SECRET_KEY: a_very_long_mock_secret_key_string_for_testing_purposes
        ALGORITHM: HS256
        MAIL_USERNAME: test@example.com
        MAIL_PASSWORD: mockpassword
        MAIL_FROM: test@example.com
        MAIL_PORT: 587
        MAIL_SERVER: smtp.example.com
        CLOUDINARY_NAME: mock_cloud
        CLOUDINARY_API_KEY: 123456789
        CLOUDINARY_API_SECRET: mock_secret
        REDIS_URL: redis://localhost:6379/0
      run: poetry run pytest -v --ignore=tests/ui --ignore=tests/live
