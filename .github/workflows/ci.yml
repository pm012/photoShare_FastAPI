name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: '2.0.1'
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Force Lock Synchronization
      # This forces poetry inside the runner to normalize the lock file 
      # structure to exactly match its current version rules.
      run: poetry lock

    - name: Install dependencies
      run: poetry install --no-interaction

    - name: Run Pytest
      env:
        PYTHONPATH: .
      run: poetry run pytest -v
