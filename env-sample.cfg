# create .env file and add the following information:

DATABASE_URL=postgresql+psycopg2://postgres:secret_password@localhost:5433/photoshare_db
# JWT
SECRET_KEY=change_me_in_production_secret_key_12345
ALGORITHM=HS256
ACCESS_TOKEN_EXPIRE_MINUTES=30
PUBLIC_API_URL=http://localhost:8000
FRONTEND_URL=http://localhost:5173
MAX_UPLOAD_SIZE_BYTES=10485760
POSTGRES_PASSWORD=replace_with_a_random_database_password
# Cloudinary
CLOUDINARY_NAME=your_name
CLOUDINARY_API_KEY=your_key
CLOUDINARY_API_SECRET=your_secret

# Redis
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_PASSWORD=replace_with_a_random_redis_password
# Mail
MAIL_USERNAME=your_email@ukr.net
MAIL_PASSWORD=your_app_specific_password  # Пароль додатка, а не основний пароль від пошти!
MAIL_FROM=your_email@ukr.net
MAIL_PORT=465
MAIL_SERVER=smtp.ukr.net
MAIL_CONFIRMATION_REQUIRED=False # False для тестування, True - для PROD
