[project]
name = "photoshare-fastapi"
version = "0.1.0"
description = ""
authors = [
    {name = "Serhii Kroshka",email = "pm012@ukr.net"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pyjwt[crypto] (>=2.13.0,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "cloudinary (>=1.46.2,<2.0.0)",
    "qrcode (>=8.2,<9.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.*Using .httpx. with .starlette.testclient. is deprecated.*",
    "ignore:.*The anyio.abc.BlockingPortal alias is deprecated.*",
    "ignore:.*passlib.*:DeprecationWarning"
]


