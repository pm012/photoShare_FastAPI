[project]
name = "photoshare-fastapi"
version = "0.1.0"
description = ""
authors = [
    {name = "Serhii Kroshka",email = "pm012@ukr.net"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "pyjwt[crypto] (>=2.13.0,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "cloudinary (>=1.46.2,<2.0.0)",
    "qrcode (>=8.2,<9.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
    "fastapi-mail (>=1.6.8,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "playwright (>=1.64.1,<2.0.0)",
    "pytest-playwright (>=0.10.0,<0.11.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
]
# Browser (UI) tests live in their own group, so the unit-test CI job never
# downloads Playwright. Install with: poetry install --with dev,e2e
e2e = [
    "pytest-playwright (>=0.10.0,<0.11.0)",
    "pytest-xdist (>=3.8.0,<4.0.0)",
]

[tool.poetry.group.e2e]
optional = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Binds the sub-directory conftest module cleanly into python import notation
asyncio_mode = "auto"
# Automatic launch of the coverage for the src folder and generation of HTML-report
# tests/ui is a separate suite with its own tests/ui/pytest.ini (needs a running stack).
addopts = "--cov=src --cov-report=term-missing --cov-report=html --ignore=tests/ui --ignore=tests/live"
filterwarnings = [
    "ignore:.*Using .httpx. with .starlette.testclient. is deprecated.*",
    "ignore:.*The anyio.abc.BlockingPortal alias is deprecated.*",
    "ignore:.*passlib.*:DeprecationWarning",
    "ignore:.*asyncio.iscoroutinefunction. is deprecated.*:DeprecationWarning"
]

[tool.poetry]
package-mode = false


